<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Phone AU Layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        /* Bingkai Mockup Handphone */
        .phone-frame {
            width: 380px;
            height: 760px;
            background-color: #000;
            border-radius: 45px;
            padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 4px #334155;
            position: relative;
            overflow: hidden;
        }

        /* Dynamic Island / Notch Atas */
        .notch {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background-color: #000;
            border-radius: 20px;
            z-index: 999;
        }

        /* Layar HP Internal */
        .phone-screen {
            width: 100%;
            height: 100%;
            background-color: #1e293b;
            border-radius: 35px;
            position: relative;
            overflow: hidden;
        }

        /* Semua Halaman/Apps */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background-size: cover;
            background-position: center;
        }

        /* Halaman Aktif */
        .page.active {
            display: block;
        }

        /* Grid Aplikasi di Homescreen */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 80px 25px 25px 25px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
        }

        .app-icon img {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            margin-bottom: 5px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s ease;
        }

        .app-icon:active img {
            transform: scale(0.9);
        }

        .app-icon span {
            font-size: 11px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Tombol Back Universal di Bagian Bawah */
        .back-nav {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            cursor: pointer;
            z-index: 1000;
            transition: background-color 0.2s;
        }

        .back-nav:hover {
            background-color: #fff;
        }

        /* Tampilan Gambar Full di dalam App */
        .app-content-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="notch"></div>
        
        <div class="phone-screen">
            
            <!-- 1. HOMESCREEN (Ubah background-image sesuai wallpaper kamu) -->
            <div id="homescreen" class="page active" style="background-image: url('images/wallpaper.jpg');">
                <div class="app-grid">
                    
                    <!-- Aplikasi 1: WhatsApp -->
                    <div class="app-icon" onclick="openApp('app-whatsapp')">
                        <img src="images/icon-wa.png" alt="WA">
                        <span>WhatsApp</span>
                    </div>

                    <!-- Aplikasi 2: Twitter / X -->
                    <div class="app-icon" onclick="openApp('app-twitter')">
                        <img src="images/icon-x.png" alt="X">
                        <span>Twitter</span>
                    </div>

                    <!-- Aplikasi 3: Instagram -->
                    <div class="app-icon" onclick="openApp('app-instagram')">
                        <img src="images/icon-ig.png" alt="Instagram">
                        <span>Instagram</span>
                    </div>

                </div>
            </div>

            <!-- 2. HALAMAN APLIKASI WHATSAPP -->
            <div id="app-whatsapp" class="page">
                <!-- Masukkan screenshot isi chat WhatsApp kamu di sini -->
                <img src="images/chat-whatsapp.jpg" class="app-content-img" alt="Chat WA">
            </div>

            <!-- 3. HALAMAN APLIKASI TWITTER -->
            <div id="app-twitter" class="page">
                <!-- Masukkan screenshot timeline/profile Twitter AU kamu di sini -->
                <img src="images/feed-twitter.jpg" class="app-content-img" alt="Twitter Feed">
            </div>

            <!-- 4. HALAMAN APLIKASI INSTAGRAM -->
            <div id="app-instagram" class="page">
                <!-- Masukkan screenshot feeds Instagram kamu di sini -->
                <img src="images/feed-instagram.jpg" class="app-content-img" alt="Instagram Feed">
            </div>

            <!-- Tombol Navigasi Home (Garis Bawah iPhone) -->
            <div class="back-nav" onclick="goHome()" title="Kembali ke Utama"></div>

        </div>
    </div>

    <script>
        // Fungsi untuk membuka aplikasi
        function openApp(appId) {
            // Sembunyikan semua halaman
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            
            // Tampilkan aplikasi yang dipilih
            document.getElementById(appId).classList.add('active');
        }

        // Fungsi untuk kembali ke Homescreen (Klik garis bawah)
        function goHome() {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            
            document.getElementById('homescreen').classList.add('active');
        }
    </script>
</body>
</html>
