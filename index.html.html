            <button class="app" onclick="openApp('Instagram')"><span class="icon social">◎</span>Instagram</button>
          </div>
          <div class="dock">
            <button class="app" onclick="openApp('Phone')"><span class="icon phoneapp">☎</span></button>
            <button class="app" onclick="openApp('Messages')"><span class="icon messages">●</span></button>
            <button class="app" onclick="openApp('Safari')"><span class="icon safari">🧭</span></button>
            <button class="app" onclick="openApp('Music')"><span class="icon music">♫</span></button>
          </div>
        </div>
      </section>

      <section class="view app-view" id="appview">
        <div class="app-header"><button class="back" onclick="goHome()">‹ Home</button><h1 id="app-title">Messages</h1><button class="header-action" id="header-action" onclick="showToast('Demo mode','Edit the sample content in index.html to personalize this phone.')">Edit</button></div>
        <div id="app-body"></div>
      </section>

      <section class="view" id="chatview">
        <div class="chat-view">
          <div class="chat-top"><button class="back" onclick="openApp('Messages')">‹ Messages</button><div class="avatar" id="chat-avatar">H</div><div class="chat-title" id="chat-title">Hanta</div></div>
          <div class="messages" id="chat-messages"></div>
          <form class="composer" id="composer"><button class="plus" type="button" onclick="showToast('Attachments','This is a visual demo. You can customize this action later.')">+</button><input id="message-input" placeholder="iMessage" autocomplete="off"><button class="send" type="submit">↑</button></form>
        </div>
      </section>

      <div class="toast" id="toast"><strong id="toast-title">Notification</strong><span id="toast-text"></span></div>
      <div class="home-indicator" id="home-indicator" title="Return to Home" onclick="goHome()"></div>
    </div>
  </div>
  <div style="font-size:12px;color:#716d79;text-align:center;max-width:340px;line-height:1.5">An interactive fictional iPhone concept. Tap the lock-screen notification, explore the apps, and open conversations.</div>
</div>
<script>
const contacts = [
 {name:"Hanta", initials:"H", time:"9:38", preview:"Are you awake?", messages:[
  ["them","Morning, Aubry. Are you awake?","9:36"],
  ["me","unfortunately yes. what do you want, old man","9:37"],
  ["them","For you to be nice to me before 10 a.m.","9:37"],
  ["me","can't promise something unrealistic","9:38"]
 ]},
 {name:"Jian", initials:"J", time:"Yesterday", preview:"Don't forget to call me.", messages:[
  ["them","Don't forget to call me when you're free.","Yesterday"],
  ["me","i'm always free for you (lie)","Yesterday"],
  ["them","Aubry.","Yesterday"],
  ["me","okay okay i'll call 😭","Yesterday"]
 ]},
 {name:"Zico", initials:"Z", time:"Yesterday", preview:"sent you 3 photos", messages:[
  ["them","I found the photos from last weekend.","Yesterday"],
  ["them","sent you 3 photos","Yesterday"],
  ["me","WAIT the one where i look expensive????","Yesterday"],
  ["them","You were holding a paper cup.","Yesterday"]
 ]},
 {name:"Rui", initials:"R", time:"Mon", preview:"Dad asked about Sunday.", messages:[
  ["them","Dad asked if you're coming on Sunday.","Mon"],
  ["me","is there food","Mon"],
  ["them","That's your first question?","Mon"],
  ["me","it's an important question","Mon"]
 ]},
 {name:"Jeka", initials:"J", time:"Mon", preview:"bro you're so embarrassing", messages:[
  ["them","bro you're so embarrassing","Mon"],
  ["me","and yet you keep texting me","Mon"],
  ["them","for research purposes","Mon"]
 ]}
];
let activeContact = null;
const $ = id => document.getElementById(id);
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');
 $('status').style.color=(id==='lock')?'white':'#111';$('home-indicator').classList.toggle('light',id==='lock');}
function unlock(){showView('home')}
$('lock').addEventListener('click', e=>{if(!e.target.closest('button'))unlock()});
$('lock-time').addEventListener('click',unlock);
function goHome(){activeContact=null;showView('home')}
function openApp(name){
 showView('appview');$('app-title').textContent=name;$('header-action').style.display='block';$('header-action').textContent=name==='Messages'?'Edit':name==='Photos'?'Select':'•••';
 const body=$('app-body');body.innerHTML='';
 if(name==='Messages'){
   $('header-action').onclick=()=>showToast('Messages','Tap a conversation to open it. Edit contacts and messages in index.html.');
   body.innerHTML='<div class="search">⌕　Search</div><div class="contact-list" id="contact-list"></div><div class="bottom-nav"><button class="nav-item selected"><span>▤</span>Messages</button><button class="nav-item" onclick="showToast(\'Contacts\',\'Your fictional contacts live in Messages for this demo.\')"><span>♙</span>Contacts</button></div>';
   const list=$('contact-list');
   contacts.forEach((c,i)=>{const b=document.createElement('button');b.className='contact';b.innerHTML=`<span class="avatar">${c.initials}</span><span class="contact-main"><span class="contact-name">${c.name}</span><span class="contact-preview">${c.preview}</span></span><span class="contact-time">${c.time}</span>`;b.onclick=()=>openChat(i);list.appendChild(b)});
 } else if(name==='Phone'){
   $('header-action').style.display='none';
   body.innerHTML='<div class="simple-content"><h2>Favorites</h2>'+contacts.slice(0,3).map(c=>`<div class="settings-row"><span>👤　${c.name}</span><span style="color:#1685ff">☎</span></div>`).join('')+'<h2>Recents</h2><p style="color:#888;font-size:13px">Your recent calls will appear here.</p><div style="text-align:center;font-size:34px;margin-top:35px">⌨</div><p style="text-align:center;color:#888">Keypad · demo</p></div>';
 } else if(name==='Photos'){
   $('header-action').onclick=()=>showToast('Photos','Replace these colorful placeholders with your own images in the code.');
   body.innerHTML='<div class="simple-content"><h2>Library</h2><p style="color:#888;font-size:12px">Recent Days</p><div class="photo-grid">'+Array.from({length:18},(_,i)=>`<button class="photo-tile" onclick="showToast('Photo ${i+1}','Demo photo placeholder. Add your own image assets later.')">${['☁','♡','✦','🌷','☀','♫'][i%6]}</button>`).join('')+'</div></div>';
 } else if(name==='Notes'){
   $('header-action').onclick=()=>showToast('Notes','Add or edit note cards in the HTML source.');
   body.innerHTML='<div class="simple-content"><h2>Notes</h2><div class="note-card"><b>Sunday brunch</b><br>Remember to ask Hanta what time he is picking me up.<br><small>Today · 9:12 AM</small></div><div class="note-card"><b>Things to do</b><br>□ Call Jian<br>□ Return Zico’s jacket<br>□ Buy matcha ice cream</div><div class="note-card"><b>Draft</b><br>Some things are easier to joke about than explain.</div></div>';
 } else if(name==='Settings'){
   $('header-action').style.display='none';
   body.innerHTML='<div class="simple-content"><div style="display:flex;align-items:center;gap:12px;padding:18px;background:white;border-radius:14px;margin-bottom:18px"><div class="avatar" style="width:56px;height:56px">A</div><div><b>Aubry</b><div style="font-size:12px;color:#888;margin-top:5px">Apple Account · demo</div></div></div>'+['Airplane Mode　　○','Wi-Fi　　Connected','Bluetooth　　On','Notifications　　›','Wallpaper　　›','General　　›','Privacy & Security　　›'].map(x=>`<div class="settings-row">${x}</div>`).join('')+'</div>';
 } else {
   $('header-action').style.display='none';
   const content={Calendar:'<div class="simple-content"><h2>Wednesday 21</h2><div class="note-card">10:00 AM · Coffee with Jeka</div><div class="note-card">12:30 PM · Lunch</div><div class="note-card">7:00 PM · Keep the evening free</div></div>',Camera:'<div class="simple-content" style="background:#202024;color:white;height:calc(100% - 95px);display:grid;place-items:center;text-align:center"><div><div style="font-size:70px">◉</div><p>Camera preview</p><button onclick="showToast(\'Camera\',\'Camera is a visual placeholder in this prototype.\')" style="border:3px solid white;background:#ddd;width:58px;height:58px;border-radius:50%"></button></div></div>',Mail:'<div class="simple-content"><h2>Inbox</h2><div class="settings-row">Dad　　Sunday lunch</div><div class="settings-row">Manager　　Schedule update</div></div>',Safari:'<div class="simple-content"><div class="search">⌕　Search or enter website</div><h2>Favorites</h2><div class="photo-grid"><div class="note-card">News</div><div class="note-card">Work</div><div class="note-card">Music</div></div></div>',Music:'<div class="simple-content" style="text-align:center;padding-top:70px"><div style="font-size:90px">♫</div><h2>Now Playing</h2><p style="color:#888">A song for a fictional story</p><div style="font-size:28px;margin-top:35px">◀　Ⅱ　▶</div></div>',Reminders:'<div class="simple-content"><h2>Reminders</h2><div class="settings-row">○　Buy matcha ice cream</div><div class="settings-row">○　Call Jian</div><div class="settings-row">○　Text Hanta back</div></div>',Instagram:'<div class="simple-content"><h2>Instagram</h2><div class="note-card">📷　aubry.jpg<br><br>Sunday looked good on me, actually.</div><div class="photo-grid"><div class="photo-tile">♡</div><div class="photo-tile">✦</div><div class="photo-tile">☀</div></div></div>'};
   body.innerHTML=content[name]||'<div class="simple-content"><h2>'+name+'</h2><p style="color:#888">This app is a placeholder in the demo.</p></div>';
 }
}
function openChatFromLock(i){
 unlock();
 openChat(i);
}
function openChat(i){
 activeContact=contacts[i];showView('chatview');$('chat-title').textContent=activeContact.name;$('chat-avatar').textContent=activeContact.initials;
 const box=$('chat-messages');box.innerHTML='<div class="day-label">iMessage · Today</div>';
 activeContact.messages.forEach(m=>addBubble(m[0],m[1],m[2],false));box.scrollTop=box.scrollHeight;
}
function addBubble(side,text,time,append=true){
 const box=$('chat-messages');const div=document.createElement('div');div.className='bubble '+side;div.textContent=text;
 const small=document.createElement('small');small.textContent=time||'Now';div.appendChild(small);box.appendChild(div);if(append)box.scrollTop=box.scrollHeight;
}
$('composer').addEventListener('submit',e=>{e.preventDefault();const input=$('message-input');const val=input.value.trim();if(!val||!activeContact)return;addBubble('me',val,'Now');input.value='';activeContact.preview=val;activeContact.time='Now';});
function showToast(title,txt){$('toast-title').textContent=title;$('toast-text').textContent=txt;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2600)}
function updateClock(){
 const d=new Date();const time=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
 $('status-time').textContent=time;$('lock-time').textContent=time;$('home-clock').textContent=time;
 const date=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
 $('lock-date').textContent=date;$('home-date').textContent=date;
}
updateClock();setInterval(updateClock,30000);
</script>
</body>
</html>
